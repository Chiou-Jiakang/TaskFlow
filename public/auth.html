<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TaskFlow 帳號註冊與登入" />
    <meta name="referrer" content="same-origin" />

    <title>登入與註冊｜TaskFlow</title>

    <link rel="stylesheet" href="/auth.css" />
    <script src="/auth.js" defer></script>
  </head>

  <body class="auth-page">
    <main class="auth-layout">
      <!-- 左側品牌介紹 -->
      <section class="auth-intro" aria-labelledby="intro-title">
        <a href="/auth.html" class="auth-brand" aria-label="TaskFlow 帳號入口">
          <span class="auth-logo">T</span>
          <span>TaskFlow<span class="auth-dot">.</span></span>
        </a>

        <p class="auth-eyebrow">PROJECT 04 · TASK MANAGEMENT</p>

        <h1 id="intro-title">
          讓協作從同一個
          <br />
          工作空間開始。
        </h1>

        <p class="auth-summary">
          建立帳號、管理自己的專案， 逐步將團隊任務集中在 TaskFlow。
        </p>

        <div class="auth-features" aria-label="目前支援功能">
          <p>✓ 安全的帳號與 Session 驗證</p>
          <p>✓ 專案資料儲存在 SQLite</p>
          <p>✓ 後續將支援多人任務協作</p>
        </div>
      </section>

      <!-- 右側帳號表單 -->
      <section class="auth-panel" aria-labelledby="form-title">
        <div class="auth-card">
          <p class="auth-card-caption">WELCOME TO TASKFLOW</p>

          <h2 id="form-title">歡迎回來</h2>

          <p id="form-subtitle" class="auth-card-subtitle">
            登入後查看自己的專案工作空間。
          </p>

          <!-- 切換登入與註冊 -->
          <div class="auth-switch" aria-label="選擇帳號操作">
            <button
              id="show-login"
              type="button"
              aria-pressed="true"
              class="selected"
            >
              登入
            </button>

            <button id="show-register" type="button" aria-pressed="false">
              建立帳號
            </button>
          </div>

          <!-- 錯誤與成功訊息 -->
          <div
            id="auth-message"
            class="auth-message"
            role="status"
            aria-live="polite"
            hidden
          ></div>

          <!-- 登入表單 -->
          <form id="login-form" autocomplete="on">
            <label for="login-email">Email</label>

            <input
              id="login-email"
              name="email"
              type="email"
              autocomplete="username"
              maxlength="254"
              placeholder="name@example.com"
              required
            />

            <label for="login-password">密碼</label>

            <input
              id="login-password"
              name="password"
              type="password"
              autocomplete="current-password"
              required
            />

            <button type="submit" class="auth-submit">登入 TaskFlow</button>
          </form>

          <!-- 註冊表單 -->
          <form id="register-form" autocomplete="on" hidden>
            <label for="register-name">顯示名稱</label>

            <input
              id="register-name"
              name="displayName"
              type="text"
              autocomplete="nickname"
              maxlength="80"
              placeholder="你希望團隊如何稱呼你"
              required
            />

            <label for="register-email">Email</label>

            <input
              id="register-email"
              name="email"
              type="email"
              autocomplete="username"
              maxlength="254"
              placeholder="name@example.com"
              required
            />

            <label for="register-password">密碼</label>

            <input
              id="register-password"
              name="password"
              type="password"
              autocomplete="new-password"
              minlength="12"
              maxlength="128"
              required
              aria-describedby="password-hint"
            />

            <p id="password-hint" class="auth-hint">
              請使用 12～128 個字元的密碼。
            </p>

            <label for="register-confirm">確認密碼</label>

            <input
              id="register-confirm"
              name="confirmPassword"
              type="password"
              autocomplete="new-password"
              minlength="12"
              maxlength="128"
              required
            />

            <button type="submit" class="auth-submit">建立帳號</button>
          </form>

          <p class="auth-footnote">
            目前為本機開發版本， 請勿使用其他服務的真實密碼。
          </p>
        </div>
      </section>
    </main>
  </body>
</html>
